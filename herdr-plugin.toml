id = "termux-probe"
name = "termux-probe"
version = "0.1.0"
description = "Throwaway probe: record the environment a server-spawned build step receives."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[build]]
platforms = ["linux", "macos"]
command = ["/bin/sh", "scripts/probe-build.sh"]

[[actions]]
id = "probe-env"
platforms = ["linux", "macos"]
title = "Probe env"
description = "Dump the environment as seen by a server-spawned action process."
command = ["/bin/sh", "scripts/probe-env.sh"]
