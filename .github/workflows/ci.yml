name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancelling an in-progress main run would leave that commit with no CI verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  Lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `rustflags: ""` is load-bearing — the action's default is `-D warnings`,
      # which would apply to dependency builds and diverge the cache from local.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
          cache-key: lint
      - id: zizmor-version
        name: Read the zizmor version pinned in mise.toml
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("mise.toml", "rb"))["tools"]["zizmor"])' >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0, zizmor@${{ steps.zizmor-version.outputs.version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: just lint
      # The token goes to these steps only, not to `just lint`'s dependency builds.
      - run: just zizmor
        env:
          GH_TOKEN: ${{ github.token }}
      - run: just zizmor-test
        env:
          GH_TOKEN: ${{ github.token }}

  Test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
          cache-key: test
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0
      - run: just test
      # These four ride this job rather than E2ETests: they stub herdr instead
      # of fetching one, so they need nothing the toolchain above has not installed.
      - run: just palette-e2e
      - run: just open-test
      - run: just catalog-e2e-test
      - run: just popup-collision-e2e-test
      # Rides this required job so a manifest version drifting from package.json,
      # which the release publishes from, blocks the merge that caused it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: just release-test

  # The unit tests check the catalog against a transcribed `--help` table, which
  # goes stale silently; this runs every entry against a real herdr (issue #24).
  # It also invokes the palette's open action twice there, since open-test's stubbed
  # collision envelope goes stale the same way (issue #133).
  E2ETests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0
      - run: just fetch-herdr
      - run: just catalog-e2e
      - run: just popup-collision-e2e

  Build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ""
          cache-key: build
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0
      # cargo test compiles the test profile only. This is the sole check that
      # exercises [profile.release] and .cargo/config.toml's rust-lld pin.
      - run: just build-musl
