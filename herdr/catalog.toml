# Command catalog for the palette.
#
# No API enumerates Herdr's built-in operations, so this list is data the plugin
# carries (docs/design.md §4). It is TOML next to the binary rather than
# compiled in, so an entry can be corrected without a rebuild.
#
# The herdr release these entries were last checked against. Distinct from the
# manifest's `min_herdr_version`, which is a hard install gate: this one is a
# soft baseline, and the palette only warns when the running herdr is older.
# When Herdr changes its CLI this file drifts and nothing detects that
# automatically — bump this deliberately on each re-check, and read a failed
# dispatch naming a command id as the report of a drifted entry.
checked_against = "0.8.2"

# `args` is appended to $HERDR_BIN_PATH and run as-is.
#
# `resolve` marks an entry that cannot name its target until open time. Its
# value is the list API whose rows become the candidates; the chosen row's id is
# substituted for the {} placeholder in `args`. Entries with no `resolve` key
# run exactly as written.
#
# {pane}, {tab} and {workspace} are the ids of what the user was looking at when
# the palette opened. An entry naming one the invocation lacks is not offered.
#
# A pane entry names its target with {pane}, never with the CLI's --current:
# --current resolves against the server's focused pane, which while the palette
# is up is the popup rather than the pane it was opened from.
#
# `contexts` uses the manifest's vocabulary: global | workspace | tab | pane.


# ─── Panes: splitting ────────────────────────────────────────────────────────
# `pane split --direction` accepts right and down only. There is no left or up,
# so the palette offers the two that exist rather than four that read evenly.

[[command]]
id = "pane.split.right"
title = "Split pane: right"
args = ["pane", "split", "--pane", "{pane}", "--direction", "right"]
contexts = ["pane"]

[[command]]
id = "pane.split.down"
title = "Split pane: down"
args = ["pane", "split", "--pane", "{pane}", "--direction", "down"]
contexts = ["pane"]


# ─── Panes: moving focus ─────────────────────────────────────────────────────
# `pane focus --direction` does take all four.

[[command]]
id = "pane.focus.left"
title = "Focus pane: left"
args = ["pane", "focus", "--pane", "{pane}", "--direction", "left"]
contexts = ["pane"]

[[command]]
id = "pane.focus.right"
title = "Focus pane: right"
args = ["pane", "focus", "--pane", "{pane}", "--direction", "right"]
contexts = ["pane"]

[[command]]
id = "pane.focus.up"
title = "Focus pane: up"
args = ["pane", "focus", "--pane", "{pane}", "--direction", "up"]
contexts = ["pane"]

[[command]]
id = "pane.focus.down"
title = "Focus pane: down"
args = ["pane", "focus", "--pane", "{pane}", "--direction", "down"]
contexts = ["pane"]


# ─── Panes: arranging ────────────────────────────────────────────────────────

[[command]]
id = "pane.zoom.toggle"
title = "Zoom pane: toggle"
args = ["pane", "zoom", "--pane", "{pane}", "--toggle"]
contexts = ["pane"]

[[command]]
id = "pane.swap.left"
title = "Swap pane: left"
args = ["pane", "swap", "--pane", "{pane}", "--direction", "left"]
contexts = ["pane"]

[[command]]
id = "pane.swap.right"
title = "Swap pane: right"
args = ["pane", "swap", "--pane", "{pane}", "--direction", "right"]
contexts = ["pane"]

# `pane close` takes its pane id positionally rather than behind --pane.
[[command]]
id = "pane.close"
title = "Close pane"
args = ["pane", "close", "{pane}"]
contexts = ["pane"]

# Moving a pane needs a destination the user picks. `--tab` is one of three
# mutually exclusive destination forms, and the tab form additionally requires
# `--split`: without it the CLI prints its usage and moves nothing.
[[command]]
id = "pane.move.tab"
title = "Move pane to tab…"
args = ["pane", "move", "{pane}", "--tab", "{}", "--split", "right"]
resolve = "tab list"
contexts = ["pane"]

[[command]]
id = "pane.move.new-tab"
title = "Move pane to a new tab"
args = ["pane", "move", "{pane}", "--new-tab"]
contexts = ["pane"]


# ─── Tabs ────────────────────────────────────────────────────────────────────

[[command]]
id = "tab.create"
title = "New tab"
args = ["tab", "create", "--focus"]
contexts = ["global", "workspace", "tab", "pane"]

[[command]]
id = "tab.focus"
title = "Focus tab…"
args = ["tab", "focus", "{}"]
resolve = "tab list"
contexts = ["global", "workspace", "tab", "pane"]

# `tab rename` is deliberately absent: it takes `<TAB_ID> <LABEL>...` with the
# label a REQUIRED positional, and the palette has no free-text input stage to
# supply one. It belongs here once such a stage exists.
[[command]]
id = "tab.close"
title = "Close tab…"
args = ["tab", "close", "{}"]
resolve = "tab list"
contexts = ["global", "workspace", "tab", "pane"]


# ─── Workspaces ──────────────────────────────────────────────────────────────

[[command]]
id = "workspace.create"
title = "New workspace"
args = ["workspace", "create", "--focus"]
contexts = ["global", "workspace", "tab", "pane"]

[[command]]
id = "workspace.focus"
title = "Focus workspace…"
args = ["workspace", "focus", "{}"]
resolve = "workspace list"
contexts = ["global", "workspace", "tab", "pane"]

[[command]]
id = "workspace.close"
title = "Close workspace…"
args = ["workspace", "close", "{}"]
resolve = "workspace list"
contexts = ["global", "workspace", "tab", "pane"]


# ─── Session ─────────────────────────────────────────────────────────────────
# Not daily, but the recovery path after editing config.toml by hand — which
# this plugin's own keybinding requires (§10), so a user who needs it once needs
# it before anything else works.

[[command]]
id = "server.reload-config"
title = "Reload config"
args = ["server", "reload-config"]
contexts = ["global", "workspace", "tab", "pane"]
