[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

# r-efi's LGPL-2.1-or-later arm is unlisted on purpose: its permissive arms
# satisfy the expression, so allowing the copyleft one would be wrong.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "BSL-1.0",
    # Reached only on targets not built here, so `check licenses` warns
    # `license-not-encountered` on these three.
    "Unicode-DFS-2016",
    "MPL-2.0",
    "WTFPL",
]
confidence-threshold = 0.8

# A duplicate version is upstream's resolution, not something the author's diff
# caused, so it reports rather than fails.
[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
